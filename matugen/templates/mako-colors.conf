# Auto-generated Mako notification config by Matugen
# Theme: Material You (Dark Mode) — gregouzze-shell

font=JetBrains Mono 10
background-color={{colors.surface_container.default.hex}}E6
text-color={{colors.on_surface.default.hex}}
border-color={{colors.primary.default.hex}}
border-size=2
border-radius=12
width=380
height=120
margin=10
padding=14
default-timeout=5000
layer=overlay
anchor=top-right
icons=1
max-icon-size=48
icon-path=/usr/share/icons/Papirus-Dark

[urgency=high]
background-color={{colors.error_container.default.hex}}E6
text-color={{colors.on_error_container.default.hex}}
border-color={{colors.error.default.hex}}
default-timeout=10000

[urgency=low]
background-color={{colors.surface_variant.default.hex}}CC
text-color={{colors.on_surface_variant.default.hex}}
border-color={{colors.outline_variant.default.hex}}
default-timeout=3000
