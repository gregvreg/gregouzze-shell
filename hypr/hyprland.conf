# ==============================================================================
# Hyprland Main Configuration - gregouzze-shell
# Modular setup importing dynamic colors, keybinds, and rules
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Source Dynamic Modules
# ------------------------------------------------------------------------------
source = ~/.config/gregouzze-shell/hypr/colors.conf
source = ~/.config/gregouzze-shell/hypr/keybinds.conf
source = ~/.config/gregouzze-shell/hypr/rules.conf

# ------------------------------------------------------------------------------
# 2. Monitors Setup
# ------------------------------------------------------------------------------
monitor = , preferred, auto, 1

# ------------------------------------------------------------------------------
# 3. Autostart Applications & Daemons
# ------------------------------------------------------------------------------
exec-once = swww-daemon
exec-once = quickshell -p ~/.config/gregouzze-shell/quickshell/shell.qml
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ------------------------------------------------------------------------------
# 4. Input Configuration
# ------------------------------------------------------------------------------
input {
    kb_layout = fr,us
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# ------------------------------------------------------------------------------
# 5. General Layout & Styling
# ------------------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Dynamic borders generated by Matugen
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    layout = dwindle
    allow_tearing = false
}

# ------------------------------------------------------------------------------
# 6. Decoration & Blur
# ------------------------------------------------------------------------------
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = $shadow
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# ------------------------------------------------------------------------------
# 7. Animations (Smooth & responsive)
# ------------------------------------------------------------------------------
animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 4.5, easeOutQuint
    animation = windowsIn, 1, 4.5, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3.5, easeInOutCubic, popin 80%
    animation = border, 1, 6, linear
    animation = borderangle, 1, 30, linear, loop
    animation = fade, 1, 3.5, easeInOutCubic
    animation = workspaces, 1, 4.5, easeOutQuint, slide
}

# ------------------------------------------------------------------------------
# 8. Layouts Configuration
# ------------------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
