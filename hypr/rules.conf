# ==============================================================================
# Hyprland Window & Layer Rules — gregouzze-shell
# ==============================================================================

# ── Quickshell Layer Rules (Glassmorphism & Blur) ─────────────────────────────
layerrule = blur, quickshell
layerrule = ignorezero, quickshell
layerrule = xray 1, quickshell

# ── Floating Dialogs & Utilities ──────────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.freedesktop.impl.portal.desktop.kde)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Confirm to replace files)$
windowrulev2 = float, title:^(File Operation Progress)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(gnome-system-monitor)$

# ── Kitty Terminal ────────────────────────────────────────────────────────────
windowrulev2 = opacity 0.94 0.88, class:^(kitty)$

# ── Firefox Picture-in-Picture ────────────────────────────────────────────────
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$

# ── XWayland ──────────────────────────────────────────────────────────────────
windowrulev2 = bordersize 0, xwayland:1

# ── Suppress maximize events ─────────────────────────────────────────────────
windowrulev2 = suppressevent maximize, class:.*
